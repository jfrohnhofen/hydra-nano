[target.thumbv6m-none-eabi]
# Flash over USB (no probe, no BOOTSEL button). See scripts/fw-flash.
runner = "scripts/fw-flash"

[alias]
fw-build = "build -p firmware --release --target thumbv6m-none-eabi --bin firmware"
fw-run = "run -p firmware --release --target thumbv6m-none-eabi --bin firmware"
fw-check = "check -p firmware --target thumbv6m-none-eabi --bin firmware"
web-preview = "run -p sacn-core --example web_preview"

[env]
DEFMT_LOG = "info"
SMOLTCP_IFACE_MAX_MULTICAST_GROUP_COUNT = "16"
